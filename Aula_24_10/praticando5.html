<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        p{

            font-size: 30px;

            padding: 15px 0px;
        }
        .ggg{
            width: 60vw;

        }
        .peq{

        }
        .pp{

        }

</head>

    <h1>Praticando 5 - Escada Invertida com Cores</h1>

    <div class="degrade">
