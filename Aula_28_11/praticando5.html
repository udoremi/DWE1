<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .div-maior{
            height: 300px;
            background-color: #d0e7ff;
            padding: 20px;
            text-align: center;
            display: none;
        }

        .div-maior .div-menor{
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .div-maior p{
            font-size: 80px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Praticando 3 - Mostrar/Esconder</h2>
        <div class="d-flex justify-content-between my-3">
            <button id="btn-mostrar" class="btn btn-primary">Mostrar</button>
            <button id="btn-esconder" class="btn btn-primary">Esconder</button>
        </div>
        <div id="div-maior" class="div-maior">
            <div class="div-menor">
                <p>Meu DIV</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const btnMostrar = document.getElementById('btn-mostrar');
        const btnEsconder = document.getElementById('btn-esconder');
        const meuDiv = document.getElementById('div-maior');

        btnMostrar.addEventListener('click', () => {
            meuDiv.style.display = 'block';
        });

        btnEsconder.addEventListener('click', () => {
            meuDiv.style.display = 'none';
        });
    </script>
</body>
</html>
