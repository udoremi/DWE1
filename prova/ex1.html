<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex1</title>
    <style>
        body{
            width: 95vw;
            margin-left: 30px;
        }
        .quadros{
            display: flex;
            flex-flow: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Exercício 1</h1>
    <hr>

    <div class="quadros">
        <div class="inputs">
            <label for="largura">Largura (vw):</label>
            <input type="number" id="largura" step="0.1">
            <label for="altura">Altura (vh):</label>
            <input type="number" id="altura" step="0.1">
        </div>
        <br>
        <br>
        <div id="quadro" style="width: 50vw; height: 50vh;">Lorem Ipsum</div> <br>
        <div id="mensagem"></div>
    </div>
    <script>
        const larguraInput = document.getElementById('largura');
        const alturaInput = document.getElementById('altura');
        const quadro = document.getElementById('quadro');
        const mensagem = document.getElementById('mensagem');
        quadro.innerHTML = '';
        function atualizarQuadro() {
            
            const largura = parseFloat(larguraInput.value);
            const altura = parseFloat(alturaInput.value);

            if (!isNaN(largura)) {
                quadro.style.width = `${largura}vw`;
            }

            if (!isNaN(altura)) {
                quadro.style.height = `${altura}vh`;
            }
        

        if (!isNaN(largura) && !isNaN(altura)) {
            
                const larguraPixels = (largura / 100) * window.innerWidth;
                const alturaPixels = (altura / 100) * window.innerHeight;
                const margem = 0.5;

                quadro.style.fontSize = '30px';
                if (Math.abs(larguraPixels - alturaPixels) <= margem) {
                    mensagem.innerHTML = 'É QUADRADO';
                    mensagem.style.padding = '5px'
                    mensagem.style.color = 'green'
                    mensagem.style.border = '3px solid green'
                    quadro.style.backgroundColor = 'lightgreen'
                    quadro.style.alignContent = 'center';
                    quadro.style.border = '5px solid black';
                    quadro.style.textAlign = 'center';
                    quadro.innerHTML = 'Lorem ipsum';
                } else {
                    quadro.style.backgroundColor = 'white'
                    mensagem.style.border = ''
                    mensagem.innerHTML = '';
                    quadro.style.border = '5px solid black';
                    quadro.style.textAlign = 'center';
                    quadro.innerHTML = 'Lorem ipsum';
                }
            }
        }

        larguraInput.addEventListener('input', atualizarQuadro);
        alturaInput.addEventListener('input', atualizarQuadro);
    </script>
</body>
</html>
</body>
</html>
