<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 5</title>
    <style>
        body{
            background-color: aquamarine;
        }
        table, td{
            border: solid 1px red;
        }
        .grande td{
            padding: 30px 60px;
            text-align: center;
        }
        .verde{
            background-color: green;
        }
        .vermelho{
            background-color: red;
        }
        .azul{
            background-color: blue;
        }
        .amarelo{
            background-color: yellow;
        }
        .legenda{
            background-color: white;
        }
        .legenda td{
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Praticando 5 - Tabela grande com rowspan, colspan e planos de fundo</h1>

    <p><a href="principal.html">Voltar ao menu principal</a></p>

    <table class="grande">
        <caption>Tabela grande com Colspan e Rowspan</caption>
        <tr class="verde">
            <td colspan="2">Colspan</td>
            <td>-</td>
            <td rowspan="3">Rowspan</td>
        </tr>
        <tr class="vermelho">
            <td>-</td>
            <td>-</td>
            <td>-</td>
        </tr>
        <tr class="azul">
            <td>-</td>
            <td colspan="2">Colspan</td>
        </tr>
        <tr class="amarelo">
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
        </tr>
    </table>

    <br>

    <table class="legenda">
        <caption>Legenda</caption>
            <tr>
                <td>Linha 1</td>
                <td class="verde">-------</td>
                <td>green</td>
            </tr>
            <tr>
                <td>Linha 2</td>
                <td class="vermelho">-------</td>
                <td>red</td>
            </tr>
            <tr>
                <td>Linha 3</td>
                <td class="azul">-------</td>
                <td>blue</td>
            </tr>
            <tr>
                <td>Linha 4</td>
                <td class="amarelo">-------</td>
                <td>yellow</td>
            </tr>
    </table>
</body>
</html>
