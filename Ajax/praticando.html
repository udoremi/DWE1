<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho: Ajax com JSON</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1>Trabalho: Ajax com JSON</h1>
        <div class="mb-4">
            <form id="form">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="nome" class="form-label">Nome:</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="button" id="gravar" class="btn btn-primary">Gravar</button>
                    <button type="reset" id="limpar" class="btn btn-warning">Limpar</button>
                    <button type="button" id="atualizar" class="btn btn-info">Atualizar dados tabela</button>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#gravar").click(function (event) {
                event.preventDefault();

                const url = "https://epansani.com.br/2024/dwe1/ajax/ins.php";

                let obj = {
                nome: $("#nome").val(),
                email: $("#email").val(),
                };

                if ($("#nome").val() === "" || $("#email").val() === "") {
                alert("Por favor, preencha todos os campos.");
                return;
                }

                $.ajax({
                url: url,
                method: "POST",
                dataType: "json",
                data: obj,
                success: function (data) {
                    console.log("Dados enviados: ", data);

                    $("#msg").removeClass("d-none").addClass("d-block");

                    setTimeout(() => {
                    $("#msg").removeClass("d-block").addClass("d-none");
                    }, 3000);

                    $("#nome").val("");
                    $("#email").val("");

                    $("#atualizar").click();
                },
                error: function (error) {
                    console.log("Erro ao enviar dados: ", error);
                    alert("Erro ao enviar dados, tente novamente mais tarde.");
                },
                });
            });

            $("#atualizar").click(function () {
                const url = "https://epansani.com.br/2024/dwe1/ajax/list.php";

                $.ajax({
                url: url,
                method: "GET",
                dataType: "json",
                success: function (data) {
                    console.log("Dados recebidos: ", data);
                    atualizaTabela(data);
                },
                error: function (error) {
                    console.log("Erro ao buscar dados: ", error);
                    alert("Erro ao buscar dados, tente novamente mais tarde.");
                },
                });
            });

            $(document).on("click", ".apagar", function () {
                const url = "https://epansani.com.br/2024/dwe1/ajax/rem.php";

                const id = $(this).data("id");

                if (!id) {
                alert("ID não encontrado para exclusão!");
                return;
                }

                const confirmar = confirm("Você realmente deseja apagar este registro?");

                if (!confirmar) {
                return;
                }

                $.ajax({
                url: url,
                method: "POST",
                dataType: "json",
                data: { id: id },
                success: function (response) {
                    console.log("Registro apagado: ", response);
                    alert("Registro apagado com sucesso.");

                    $("#atualizar").click();
                },
                error: function (error) {
                    console.log("Erro ao apagar registro: ", error);
                    alert("Erro ao apagar registro, tente novamente.");
                },
                });
            });

            $("#limpar").click(function () {
                $("#nome").val("");
                $("#email").val("");
            });
});

        function atualizaTabela(data) {
            $("tbody").empty();

            data.forEach((item) => {
                const linha = `
                    <tr>
                    <td class="col-nome">${item.nome}</td>
                    <td class="col-email">${item.email}</td>
                    <td class="col-botao">
                        <button type="button" class="btn btn-danger apagar" data-id="${item.id}">Apagar</button>
                    </td>
                    </tr>
                `;

                $("tbody").append(linha);
            });
        }
    </script>
</body>
</html>
