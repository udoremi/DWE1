<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 1</title>
</head>
<body>
    <h1>Praticando 1 - Formulários HTML</h1>
    <form action="">
        <label for="nome">Nome:</label>
        <input type="text"> <br> <br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email"> <br> <br>
        
        <label for="lista">Marca de Carro preferida:</label>
        <select name="carro" id="carro">
            <option value="VolksWagen">VolksWagen</option>
            <option value="Fiat">Fiat</option>
            <option value="GM">GM</option>
            <option value="Mercedes">Mercedes</option>
            <option value="BMW">BMW</option>
            <option value="Ford">Ford</option>
        </select> <br> <br>

        <label for="areatxt">Observações:</label> <br>
        <textarea name="" id="" cols="30" rows="10"></textarea> <br> <br>

        <label for="web">Linguagem web favorita</label>
        <input type="radio" name="html" id="html">
        <label for="html">HTML</label>
        <input type="radio" name="html" id="css">
        <label for="css">CSS</label>
        <input type="radio" name="html" id="js">
        <label for="js">JavaScript</label> <br> <br>

        <label for="filmes">Filmes que eu quero ver quando lançar:</label> <br>
        <input type="checkbox" name="ca" id="ca">
        <label for="ca">Capitão América: Admirável Mundo Novo</label> <br>
        <input type="checkbox" name="av" id="av">
        <label for="av">Avengers: The Kang Dinasty</label> <br>
        <input type="checkbox">
        <label for="ac2">O Auto da Compadecida 2</label> <br>
        <input type="checkbox" name="" id="">
        <label for="av">Avatar 3: Fogo e Cinzas</label> <br> <br>

        <input type="button" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
