<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 2</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body{
            margin-left: 50px;
        }
        p{
            font-size: 1.5em;
        }
        span{
            font-weight: bold;
        }
        .borda{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Praticando 2 - JQuery</h1>
    <p id="name">Seja bem vindo, <span></span></p>

    <button onclick="add()">Adicionar texto (parágrafo de Lorem Ipsum)</button> <br> <br>
    <button onclick="rem()">Remover texto (todos os parágrafos)</button>

    <div class="textos"></div>

    <script>
        $(document).ready(function() {
            var nome = prompt('Qual é o seu nome?');
            
            $("span").first().text(nome);
        });

        function add() {
            $(".textos").append("<p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Nemo velit reprehenderit sit voluptate ad, incidunt qui, ducimus architecto rem, consequatur officiis. Nihil amet vitae temporibus commodi error quaerat vel esse! </p>");
        }

        function rem() {
            $(".textos").empty();
        }
    </script>
</body>
</html>
