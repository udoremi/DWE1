<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixas Coloridas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .caixa {
      width: 205px;
      height: 50px;
      display: inline-block;
      margin: 5px;
      border: 5px solid black;
    }
    #preview {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2em;
      display: none; 
    }
    h1{
        margin-left: 140px;
    }
    .container{
        width: 99vw;
    }
  </style>
</head>
<body>
    <h1>Praticando 3 - JavaScript - Cores (click e mouse)</h1>
  <div class="container text-center mt-4">
    <div class="caixa" style="background-color: #FF6347;"></div>
    <div class="caixa" style="background-color: #4682B4;"></div>
    <div class="caixa" style="background-color: #32CD32;"></div>
    <div class="caixa" style="background-color: #FFD700;"></div>
    <div class="caixa" style="background-color: #8A2BE2;"></div>

    <div id="preview">Preview</div>

    <br>

    <button class="btn btn-outline-secondary mt-1" id="resetar">Resetar</button>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let corOriginal = '#f8f9fa';

    $(document).ready(function() {
      $('.caixa').click(function() {
        const cor = $(this).css('background-color');
        $('body').css('background-color', cor);
        corOriginal = cor;
      });

      $('.caixa').mouseover(function() {
        const cor = $(this).css('background-color');
        $('body').css('background-color', cor);
        $('#preview').show();
      });

      $('.caixa').mouseout(function() {
        $('body').css('background-color', corOriginal);
        $('#preview').hide();
      });

      $('#resetar').click(function() {
        $('body').css('background-color', '#f8f9fa');
        $('#preview').hide();
      });
    });
  </script>
</body>
</html>
