<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 5 - Opacidades</title>
    <style>
        img{
            max-width: 200px;
            max-height: 200px;
            padding: 0px 5px;
            opacity: 0.3;
        }
        img:hover{
            opacity: 1;
        }
        h2{
            background-color: green;
        }
        .zerooito{
            opacity: 0.8;
        }
        .zeroseis{
            opacity: 0.6;
        }
        .zeroquatro{
            opacity: 0.4;
        }
        .zerodois{
            opacity: 0.2;
        }
        .rgba8{
            background-color: rgba(0, 128, 0, 0.8);
        }
        .rgba6{
            background-color: rgba(0, 128, 0, 0.6);
        }
        .rgba4{
            background-color: rgba(0, 128, 0, 0.4);
        }
        .rgba2{
            background-color: rgba(0, 128, 0, 0.2);
        }
    </style>
</head>
<body>
    <h1>Praticando 5 - Opacidades</h1>
    <img src="img_forest.jpg" alt=""> 
    <img src="img_mountains.jpg" alt="">
    <img src="img_5terre.jpg" alt="">

    <h2>Opacidade 1.0 (valor padrão, nenhuma opacidade)</h2>
    <h2 class="zerooito">Opacidade 0.8</h2>
    <h2 class="zeroseis">Opacidade 0.6</h2>
    <h2 class="zeroquatro">Opacidade 0.4</h2>
    <h2 class="zerodois">Opacidade 0.2</h2>
    <h2 class="rgba8">RGBA 0.8</h2>
    <h2 class="rgba6">RGBA 0.6</h2>
    <h2 class="rgba4">RGBA 0.4</h2>
    <h2 class="rgba2">RGBA 0.2</h2>
</body>
</html>
